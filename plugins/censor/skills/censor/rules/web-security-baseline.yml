# Web Security Baseline — Stage-2 deterministic ruleset (Censor)
#
# Defensive security tooling: these rules DETECT insecure code patterns for human review.
# They encode the checklist in SECURITY_BASELINE.md (§ numbers in each rule's metadata).
#
# Precision stance: we prefer "flag for review with some false positives" over silent misses.
# Inherently noisy rules are marked WARNING/INFO and say so in the message.
#
# NOTE: `semgrep --test` was NOT run in the authoring environment (semgrep not installed there).
# Patterns using the deep-expression operator `<... ... ...>`, PHP string-interpolation matching,
# and JS template-literal interpolation are marked in RULES.md as "verify with semgrep --test".

rules:
  # ---------------------------------------------------------------------------
  # §2 — Database access: SQL injection via string interpolation/concatenation
  # ---------------------------------------------------------------------------
  - id: sqli-string-interpolation
    languages: [php]
    severity: ERROR
    message: >-
      Request data ($_GET/$_POST/$_REQUEST/$_COOKIE) is interpolated or concatenated into a SQL
      string that reaches a query sink (->query/->exec/mysqli_query/sqlsrv_query) or a $sql/$query
      variable. Use parameterized/prepared statements with bound params (§2). Never build SQL from
      request data by string ops.
    metadata:
      baseline: "§2"
      category: injection
      cwe: "CWE-89: SQL Injection"
    patterns:
      - pattern-either:
          - pattern: $DB->query(<... $_GET[...] ...>)
          - pattern: $DB->query(<... $_POST[...] ...>)
          - pattern: $DB->query(<... $_REQUEST[...] ...>)
          - pattern: $DB->query(<... $_COOKIE[...] ...>)
          - pattern: $DB->exec(<... $_GET[...] ...>)
          - pattern: $DB->exec(<... $_POST[...] ...>)
          - pattern: $DB->exec(<... $_REQUEST[...] ...>)
          - pattern: $DB->exec(<... $_COOKIE[...] ...>)
          - pattern: mysqli_query(<... $_GET[...] ...>)
          - pattern: mysqli_query(<... $_POST[...] ...>)
          - pattern: mysqli_query(<... $_REQUEST[...] ...>)
          - pattern: mysqli_query(<... $_COOKIE[...] ...>)
          - pattern: sqlsrv_query(<... $_GET[...] ...>)
          - pattern: sqlsrv_query(<... $_POST[...] ...>)
          - pattern: sqlsrv_query(<... $_REQUEST[...] ...>)
          - pattern: sqlsrv_query(<... $_COOKIE[...] ...>)
          - pattern: $sql = <... $_GET[...] ...>
          - pattern: $sql = <... $_POST[...] ...>
          - pattern: $sql = <... $_REQUEST[...] ...>
          - pattern: $sql = <... $_COOKIE[...] ...>
          - pattern: $query = <... $_GET[...] ...>
          - pattern: $query = <... $_POST[...] ...>
          - pattern: $query = <... $_REQUEST[...] ...>
          - pattern: $query = <... $_COOKIE[...] ...>

  # ---------------------------------------------------------------------------
  # §12 — display_errors forced on in code
  # ---------------------------------------------------------------------------
  - id: php-display-errors-on
    languages: [php]
    severity: WARNING
    message: >-
      display_errors is being turned ON in code. In production this leaks stack traces, SQL errors,
      and paths to users (§12). Keep display_errors OFF in prod; log full detail server-side.
    metadata:
      baseline: "§12"
      category: info-disclosure
    patterns:
      - pattern-either:
          - pattern: ini_set("display_errors", 1)
          - pattern: ini_set("display_errors", "1")
          - pattern: ini_set("display_errors", "On")
          - pattern: ini_set("display_errors", "on")
          - pattern: ini_set("display_errors", true)

  # ---------------------------------------------------------------------------
  # §12 — error_reporting(E_ALL): context signal (often paired with display_errors)
  # ---------------------------------------------------------------------------
  - id: php-error-reporting-all
    languages: [php]
    severity: INFO
    message: >-
      error_reporting(E_ALL) reports every error. Harmless alone, but paired with display_errors
      on (see php-display-errors-on) it surfaces sensitive detail to users (§12). Confirm errors
      are logged, not displayed, in production.
    metadata:
      baseline: "§12"
      category: info-disclosure
    patterns:
      - pattern-either:
          - pattern: error_reporting(E_ALL)
          - pattern: error_reporting(<... E_ALL ...>)

  # ---------------------------------------------------------------------------
  # §5 — Insecure session cookie (Secure flag off)
  # ---------------------------------------------------------------------------
  - id: session-cookie-insecure
    languages: [php]
    severity: WARNING
    message: >-
      Session cookie is configured without the Secure flag ('secure' => false, or
      session.cookie_secure disabled). Session cookies must be Secure; HttpOnly; SameSite=Lax (§5).
    metadata:
      baseline: "§5"
      category: session
    patterns:
      - pattern-either:
          - pattern: session_set_cookie_params([..., "secure" => false, ...])
          - pattern: ini_set("session.cookie_secure", 0)
          - pattern: ini_set("session.cookie_secure", "0")
          - pattern: ini_set("session.cookie_secure", "off")
          - pattern: ini_set("session.cookie_secure", "Off")
          - pattern: ini_set("session.cookie_secure", false)

  # ---------------------------------------------------------------------------
  # §5 — Cookie value trusted as auth identity (legacy cookie-trust auth-bypass class)
  # ---------------------------------------------------------------------------
  - id: cookie-as-identity
    languages: [php]
    severity: ERROR
    message: >-
      A $_COOKIE value is assigned directly to an identity/auth variable. Cookies are client-
      controlled; trusting one as "who the user is" is an auth bypass (§5, legacy cookie-trust
      pattern). Derive identity from a validated server session / SSO, not a raw cookie.
      NOTE: best-effort pattern; a false positive here means "review this", which is acceptable.
    metadata:
      baseline: "§5"
      category: broken-auth
    patterns:
      - pattern-either:
          - pattern: $user = <... $_COOKIE[...] ...>
          - pattern: $username = <... $_COOKIE[...] ...>
          - pattern: $userId = <... $_COOKIE[...] ...>
          - pattern: $userid = <... $_COOKIE[...] ...>
          - pattern: $userName = <... $_COOKIE[...] ...>
          - pattern: $currentUser = <... $_COOKIE[...] ...>
          - pattern: $loggedInUser = <... $_COOKIE[...] ...>
          - pattern: $authUser = <... $_COOKIE[...] ...>
          - pattern: $account = <... $_COOKIE[...] ...>

  # ---------------------------------------------------------------------------
  # §9 — phpinfo() call left in the web root
  # ---------------------------------------------------------------------------
  - id: phpinfo-call
    languages: [php]
    severity: ERROR
    message: >-
      phpinfo() dumps the full PHP configuration, loaded modules, env, and paths to anyone who
      reaches the page. No diagnostic endpoints in production (§9). Delete before deploy.
    metadata:
      baseline: "§9"
      category: info-disclosure
    patterns:
      - pattern: phpinfo(...)

  # ---------------------------------------------------------------------------
  # §9 / §1 — Debug endpoint leaking environment (env-dump debug-endpoint class)
  # ---------------------------------------------------------------------------
  - id: var-dump-getenv
    languages: [php]
    severity: ERROR
    message: >-
      Environment variables are being dumped to output (var_dump/print_r/echo of getenv()/$_ENV).
      This is a debug endpoint leaking secrets and config (§9/§1). Remove it.
    metadata:
      baseline: "§9"
      category: info-disclosure
    patterns:
      - pattern-either:
          - pattern: getenv(...)
          - pattern: $_ENV
          - pattern: $_ENV[...]
      - pattern-either:
          - pattern-inside: var_dump(...)
          - pattern-inside: print_r(...)
          - pattern-inside: echo $SINK;

  # ---------------------------------------------------------------------------
  # §3 — Reflected XSS: unescaped echo of request data
  # ---------------------------------------------------------------------------
  - id: echo-request-unescaped
    languages: [php]
    severity: ERROR
    message: >-
      Request data ($_GET/$_POST/$_REQUEST) is echoed without escaping — reflected XSS (§3).
      Wrap in htmlspecialchars(ENT_QUOTES) or the e()/h() helper at every echo.
    metadata:
      baseline: "§3"
      category: xss
      cwe: "CWE-79: Cross-site Scripting"
    patterns:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
      - pattern-either:
          - pattern-inside: echo $SINK;
          - pattern-inside: print $SINK;
      - pattern-not-inside: htmlspecialchars(...)
      - pattern-not-inside: htmlentities(...)
      - pattern-not-inside: h(...)
      - pattern-not-inside: e(...)

  # ---------------------------------------------------------------------------
  # §8a — Dynamic code execution
  # ---------------------------------------------------------------------------
  - id: eval-or-dynamic-exec
    languages: [php]
    severity: ERROR
    message: >-
      Dynamic code execution (eval / assert(var) / create_function / call_user_func on request
      data). This is remote code execution surface and violates the CSP-clean / no-eval invariant
      (§8a). Replace with explicit dispatch/whitelist.
    metadata:
      baseline: "§8a"
      category: code-injection
      cwe: "CWE-95: Eval Injection"
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: assert($X)
          - pattern: create_function(...)
          - pattern: call_user_func(<... $_GET[...] ...>, ...)
          - pattern: call_user_func(<... $_POST[...] ...>, ...)
          - pattern: call_user_func(<... $_REQUEST[...] ...>, ...)
          - pattern: call_user_func_array(<... $_GET[...] ...>, ...)
          - pattern: call_user_func_array(<... $_POST[...] ...>, ...)
          - pattern: call_user_func_array(<... $_REQUEST[...] ...>, ...)

  # ---------------------------------------------------------------------------
  # §8a — extract() on request superglobals (variable injection)
  # ---------------------------------------------------------------------------
  - id: extract-request
    languages: [php]
    severity: ERROR
    message: >-
      extract() on a request superglobal lets the client set arbitrary local variables (variable
      injection / auth bypass) (§8a). Read named fields explicitly instead.
    metadata:
      baseline: "§8a"
      category: code-injection
    patterns:
      - pattern-either:
          - pattern: extract($_GET, ...)
          - pattern: extract($_POST, ...)
          - pattern: extract($_REQUEST, ...)
          - pattern: extract($_COOKIE, ...)

  # ---------------------------------------------------------------------------
  # §12 — Exception / DB error detail echoed to output
  # ---------------------------------------------------------------------------
  - id: error-detail-echoed
    languages: [php]
    severity: WARNING
    message: >-
      Exception or DB error detail is written to output (getMessage()/sqlsrv_errors()/mysqli_error()
      in echo/die/print_r). Never show raw errors to users — show a short message + correlation id,
      log the detail server-side (§12).
    metadata:
      baseline: "§12"
      category: info-disclosure
    patterns:
      - pattern-either:
          - pattern: $X->getMessage()
          - pattern: sqlsrv_errors(...)
          - pattern: mysqli_error(...)
      - pattern-either:
          - pattern-inside: echo $SINK;
          - pattern-inside: print $SINK;
          - pattern-inside: die(...)
          - pattern-inside: print_r(...)

  # ---------------------------------------------------------------------------
  # §7 — Upload destination built from the client-supplied filename
  # ---------------------------------------------------------------------------
  - id: upload-trusts-client-name
    languages: [php]
    severity: WARNING
    message: >-
      move_uploaded_file() uses the client-supplied filename ($_FILES[...]['name']) in the
      destination path. Store with randomized/unique names, never trust the client name (§7) —
      path traversal / overwrite / executable-extension risk.
    metadata:
      baseline: "§7"
      category: file-upload
      cwe: "CWE-434: Unrestricted Upload"
    patterns:
      - pattern-either:
          - pattern: move_uploaded_file(..., <... $_FILES[...]["name"] ...>)
          - pattern: move_uploaded_file(..., <... $_FILES[...]['name'] ...>)

  # ---------------------------------------------------------------------------
  # §1 — Hardcoded-looking secret (lightweight complement to gitleaks)
  # ---------------------------------------------------------------------------
  - id: hardcoded-secret-define
    languages: [php]
    severity: WARNING
    message: >-
      A secret/key/password appears hardcoded as a string literal (define() or a $..._password
      assignment). Secrets belong in a git-ignored config/env, never in source (§1). NOTE: gitleaks
      is the primary secret scanner; this is a lightweight complement and may false-positive.
    metadata:
      baseline: "§1"
      category: secrets
      cwe: "CWE-798: Hard-coded Credentials"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: define($NAME, $VAL)
              - metavariable-regex:
                  metavariable: $NAME
                  regex: '(?i)(secret|api[_-]?key|_key|apikey|password|passwd|token)'
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"].+['\"]$"
          - patterns:
              - pattern: $VARNAME = $VAL
              - metavariable-regex:
                  metavariable: $VARNAME
                  regex: '(?i)(password|passwd|secret)'
              - metavariable-regex:
                  metavariable: $VAL
                  regex: "^['\"].+['\"]$"

  # ---------------------------------------------------------------------------
  # §3 — DOM XSS: innerHTML built by string concatenation / template literal
  # ---------------------------------------------------------------------------
  - id: innerhtml-string-build
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      .innerHTML is assigned an HTML string built by concatenation or a template literal containing
      a variable — DOM XSS if any interpolated value is untrusted (§3). Set untrusted values via
      textContent, or build nodes with the DOM API; if HTML is required, run it through a sanitizer.
    metadata:
      baseline: "§3"
      category: xss
      cwe: "CWE-79: DOM-based XSS"
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = `...${...}...`
          - pattern: $EL.innerHTML = $A + $B
          - pattern: $EL.innerHTML += `...${...}...`
          - pattern: $EL.innerHTML += $A + $B
          - pattern: $EL.outerHTML = `...${...}...`
          - pattern: $EL.outerHTML = $A + $B

  # ---------------------------------------------------------------------------
  # §3/§14 — unserialize() on request data (PHP object injection / RCE)
  # ---------------------------------------------------------------------------
  - id: php-unserialize-untrusted
    languages: [php]
    severity: ERROR
    message: >-
      unserialize() on request-sourced data enables PHP object injection (RCE via magic methods).
      Use json_decode for data; never unserialize $_GET/$_POST/$_REQUEST/$_COOKIE (§3/§14, CWE-502).
    metadata:
      baseline: "§3"
      category: deserialization
      cwe: "CWE-502: Deserialization of Untrusted Data"
    patterns:
      - pattern-either:
          - pattern: unserialize(<... $_GET[...] ...>)
          - pattern: unserialize(<... $_POST[...] ...>)
          - pattern: unserialize(<... $_REQUEST[...] ...>)
          - pattern: unserialize(<... $_COOKIE[...] ...>)

  # ---------------------------------------------------------------------------
  # §3 — LDAP injection: user input in an LDAP filter without ldap_escape
  # ---------------------------------------------------------------------------
  - id: php-ldap-injection
    languages: [php]
    severity: ERROR
    message: >-
      Request data reaches an LDAP filter without ldap_escape($v, '', LDAP_ESCAPE_FILTER).
      Escape every user value in an LDAP filter — the prepared-statement rule's LDAP twin (§3, CWE-90).
    metadata:
      baseline: "§3"
      category: injection
      cwe: "CWE-90: LDAP Injection"
    patterns:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
      - pattern-either:
          - pattern-inside: ldap_search(...)
          - pattern-inside: ldap_list(...)
          - pattern-inside: ldap_read(...)
      - pattern-not-inside: ldap_escape(...)

  # ---------------------------------------------------------------------------
  # §15 — Weak hash (md5/sha1) — never for passwords or security tokens
  # ---------------------------------------------------------------------------
  - id: php-weak-hash
    languages: [php]
    severity: WARNING
    message: >-
      md5()/sha1() are cryptographically weak. NEVER for passwords (use password_hash with
      PASSWORD_ARGON2ID/BCRYPT) or security tokens. OK only for non-security checksums (§15, CWE-916/328).
    metadata:
      baseline: "§15"
      category: crypto
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
    patterns:
      - pattern-either:
          - pattern: md5(...)
          - pattern: sha1(...)
          - pattern: hash("md5", ...)
          - pattern: hash("sha1", ...)

  # ---------------------------------------------------------------------------
  # §15 — Weak randomness for security-bearing values
  # ---------------------------------------------------------------------------
  - id: php-weak-random-token
    languages: [php]
    severity: WARNING
    message: >-
      rand()/mt_rand()/uniqid() are not cryptographically secure. For tokens/nonces/IDs/salts use
      random_bytes()/random_int(). OK only for non-security values (§15, CWE-330/338).
    metadata:
      baseline: "§15"
      category: crypto
      cwe: "CWE-330: Use of Insufficiently Random Values"
    patterns:
      - pattern-either:
          - pattern: rand(...)
          - pattern: mt_rand(...)
          - pattern: uniqid(...)

  # ---------------------------------------------------------------------------
  # §8 — Open redirect: redirect target taken from request data
  # ---------------------------------------------------------------------------
  - id: php-open-redirect
    languages: [php]
    severity: WARNING
    message: >-
      Location header built from request data is an open redirect. Validate the target against an
      allowlist, or constrain it to a same-origin path — never pass an absolute URL through from
      input. Lends your domain to phishing and can leak tokens via Referer (§8, CWE-601).
    metadata:
      baseline: "§8"
      category: redirect
      cwe: "CWE-601: URL Redirection to Untrusted Site (Open Redirect)"
    patterns:
      - pattern-inside: header(...)
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
