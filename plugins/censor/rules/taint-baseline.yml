# Censor — taint-tracking rules (semgrep CE `mode: taint`), PHP + Python + JS.
# These catch request data that FLOWS to a dangerous sink across variable
# assignments — the indirect case the single-pattern rules miss ($x = $_GET[..];
# … exec($x)). Sanitizers keep them quiet on correctly-handled input.
rules:
  # ---------------------------------------------------------------------------
  # §16 — Request data reaching a shell/command sink (PHP command injection).
  # No single-pattern PHP rule covers exec/system/shell_exec — this is new.
  # ---------------------------------------------------------------------------
  - id: php-taint-command-exec
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Request data flows into a shell command (exec/system/shell_exec/passthru/popen/proc_open) —
      command injection. escapeshellarg() each argument (and prefer a fixed program with an arg
      list), or int-cast where the value is numeric (§16, CWE-78).
    metadata:
      baseline: "§16"
      category: command-injection
      cwe: "CWE-78: OS Command Injection"
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - pattern: $_SERVER[...]
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: (integer) $X
    pattern-sinks:
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: shell_exec(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
      - pattern: "`...`"

  # ---------------------------------------------------------------------------
  # §7/§16 — Request data reaching an include/file sink (LFI / path traversal).
  # ---------------------------------------------------------------------------
  - id: php-taint-file-include
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Request data flows into a file include/read (include/require/fopen/file_get_contents/
      readfile) — local file inclusion / path traversal. Resolve against an allowlist, or
      basename() + confine under a fixed base directory and reject '..' (§7/§16, CWE-22/98).
    metadata:
      baseline: "§7"
      category: path-traversal
      cwe: "CWE-22: Path Traversal"
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: basename(...)
    pattern-sinks:
      - pattern: include $X;
      - pattern: include_once $X;
      - pattern: require $X;
      - pattern: require_once $X;
      - pattern: fopen(...)
      - pattern: file_get_contents(...)
      - pattern: readfile(...)

  # ---------------------------------------------------------------------------
  # §2 — Request data flowing to a SQL query STRING across assignments.
  # focus-metavariable pins the query-string position, so a parameterized call
  # that passes the value in the params array is NOT flagged.
  # ---------------------------------------------------------------------------
  - id: php-taint-sql-query
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Request data flows into a SQL query string (indirect: assigned to a variable, then
      concatenated/interpolated into the query). Use a prepared statement with bound parameters;
      the value belongs in the params array, never in the query text (§2, CWE-89).
    metadata:
      baseline: "§2"
      category: injection
      cwe: "CWE-89: SQL Injection"
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
    pattern-sanitizers:
      - pattern: intval(...)
      - pattern: (int) $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: sqlsrv_query($CONN, $Q, ...)
              - pattern: mysqli_query($CONN, $Q)
              - pattern: $DB->query($Q)
              - pattern: $DB->exec($Q)
          - focus-metavariable: $Q

  # ---------------------------------------------------------------------------
  # §16 (Python) — request/argv reaching a shell command sink
  # ---------------------------------------------------------------------------
  - id: py-taint-command-exec
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      External input (web request / sys.argv / input()) flows into a shell command
      (os.system/os.popen or subprocess with shell=True) — command injection. Use an argv list
      without shell=True, or shlex.quote() each field (§16, CWE-78).
    metadata: { baseline: "§16", category: command-injection, cwe: "CWE-78: OS Command Injection" }
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: sys.argv[...]
      - pattern: input(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
      - pattern: int(...)
    pattern-sinks:
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  # ---------------------------------------------------------------------------
  # §2 (Python) — request flowing into a SQL query STRING (indirect)
  # ---------------------------------------------------------------------------
  - id: py-taint-sql-query
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      External input flows into a SQL query string (assigned then concatenated/%/format into the
      query). Pass values as query parameters (execute(sql, params)), never build the query text
      from input (§2, CWE-89).
    metadata: { baseline: "§2", category: injection, cwe: "CWE-89: SQL Injection" }
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: sys.argv[...]
    pattern-sanitizers:
      - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.execute($Q)
              - pattern: $CUR.executemany($Q, ...)
          - focus-metavariable: $Q

  # ---------------------------------------------------------------------------
  # §16 (JS) — request reaching child_process (indirect flow)
  # ---------------------------------------------------------------------------
  - id: js-taint-command-exec
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: >-
      Request data (req.query/body/params) flows into child_process.exec/execSync — command
      injection. Use execFile/spawn with an argv array; never build a shell command from request
      data (§16, CWE-78).
    metadata: { baseline: "§16", category: command-injection, cwe: "CWE-78: OS Command Injection" }
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $REQ.query.$F
      - pattern: $REQ.body.$F
      - pattern: $REQ.params.$F
    pattern-sinks:
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)
