name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Validate each rule on its own so a failing job's NAME pinpoints the broken rule.
  validate-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rule:
          - sqli-string-interpolation
          - php-display-errors-on
          - php-error-reporting-all
          - session-cookie-insecure
          - cookie-as-identity
          - phpinfo-call
          - var-dump-getenv
          - echo-request-unescaped
          - eval-or-dynamic-exec
          - extract-request
          - error-detail-echoed
          - upload-trusts-client-name
          - hardcoded-secret-define
          - innerhtml-string-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep pyyaml
      - name: validate ${{ matrix.rule }}
        run: |
          python - <<'PY'
          import yaml
          p = 'plugins/censor/skills/censor/rules/web-security-baseline.yml'
          d = yaml.safe_load(open(p))
          d['rules'] = [r for r in d['rules'] if r['id'] == '${{ matrix.rule }}']
          yaml.safe_dump(d, open('one.yml', 'w'), sort_keys=False)
          PY
          if ! semgrep --validate --config one.yml 2> err.txt; then
            echo "===== semgrep --validate error for ${{ matrix.rule }} ====="
            cat err.txt
            MSG=$(tr '\n' ' ' < err.txt | tr -s ' ' | cut -c1-1200)
            echo "::error title=validate ${{ matrix.rule }}::${MSG}"
            exit 1
          fi

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners (semgrep + gitleaks)
        run: |
          pip install semgrep
          GL_URL=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                    | grep browser_download_url | grep -i 'linux_x64' | cut -d '"' -f4 | head -1)
          curl -sSL "$GL_URL" | sudo tar xz -C /usr/local/bin gitleaks
          semgrep --version && gitleaks version
      - name: Test harness (semgrep --test + gitleaks + probe selftest)
        run: bash tests/run_tests.sh
