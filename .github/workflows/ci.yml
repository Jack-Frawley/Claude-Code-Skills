name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanners (semgrep + gitleaks)
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          GL_URL=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                    | grep browser_download_url | grep -i 'linux_x64' | cut -d '"' -f4 | head -1)
          echo "gitleaks asset: $GL_URL"
          curl -sSL "$GL_URL" | sudo tar xz -C /usr/local/bin gitleaks
          semgrep --version
          gitleaks version

      - name: Validate rule syntax
        run: |
          semgrep --validate --config plugins/censor/skills/censor/rules/web-security-baseline.yml

      - name: Test harness (semgrep --test on rules+fixtures, gitleaks, probe selftest)
        run: bash tests/run_tests.sh
