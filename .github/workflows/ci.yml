name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanners (semgrep + gitleaks)
        run: |
          pip install semgrep
          GL_URL=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                    | grep browser_download_url | grep -i 'linux_x64' | cut -d '"' -f4 | head -1)
          curl -sSL "$GL_URL" | sudo tar xz -C /usr/local/bin gitleaks
          semgrep --version && gitleaks version

      - name: Validate all rulesets (rule syntax)
        run: |
          set -e
          for f in plugins/censor/skills/censor/rules/*.yml; do
            echo "== validating $f =="
            if ! semgrep --validate --config "$f" > out.txt 2>&1; then
              cat out.txt
              MSG=$(grep -iE 'error|invalid|pattern|rule|parse|expected' out.txt \
                    | tr '\n' '~' | tr -s ' ' | cut -c1-1800)
              echo "::error title=validate $(basename "$f")::${MSG:-see-log}"
              exit 1
            fi
          done

      - name: Test harness (semgrep --test on fixtures, gitleaks, probe selftest)
        run: bash tests/run_tests.sh
